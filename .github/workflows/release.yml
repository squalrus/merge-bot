name: Release

# Fallback path for a version bump landing on main other than through
# merge-bot (e.g. a maintainer merging by hand). Pushes made with the
# default GITHUB_TOKEN — which is how merge-bot itself merges — don't
# trigger this: merge-bot.yml runs scripts/tag-and-release.sh directly as
# part of its own job for that case instead.
on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Tag and publish release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/tag-and-release.sh
