name: Merge Bot

on:
  pull_request_target:
    types:
      - labeled
      - ready_for_review
      - review_request_removed
      - review_requested
      - synchronize
      - unlabeled
  pull_request_review:
    types:
      - dismissed
      - submitted
  issue_comment:
    types:
      - created

jobs:
  merge:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    name: Merge
    steps:
    - name: Integration check
      uses: squalrus/merge-bot@main
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        test: false
        reviewers: false
        labels: ready
        blocking_labels: do not merge
        checks_enabled: false
        method: squash
        delete_source_branch: false

    # Merges performed above use GITHUB_TOKEN, and GitHub doesn't trigger
    # further workflow runs (like release.yml's push trigger) from pushes
    # made with that token — so tag/release creation runs inline here
    # instead. Checks out main only (never the PR's own head), so this
    # doesn't touch the pull_request_target/fork-code safety note below.
    - name: Check out main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Tag and create GitHub release if a new version landed
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash scripts/tag-and-release.sh
