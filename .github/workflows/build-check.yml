name: Build Check

on:
  pull_request:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    name: dist/ matches source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Fail if dist/ is stale
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date with source. Run 'npm run build' and commit the result."
            git diff -- dist
            exit 1
          fi
